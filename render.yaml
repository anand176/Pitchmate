services:
  - type: web
    name: pitchmate-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PITCHMATE_MODEL
        value: gemini-2.5-flash
      - key: ARTIFACTS_ROOT_DIR
        value: /tmp/artifacts
      - key: DATABASE_URL
        fromDatabase:
          name: pitchmate-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true

databases:
  - name: pitchmate-db
    plan: free
